name: pre-commit

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        # no pylint for py315 available (dill lacks a release with 3.15 support)
        python-version: '3.14'
    - uses: pre-commit/action@v3.0.1

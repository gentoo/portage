name: CI

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    # See .github/ci/Dockerfile. The CI_IMAGE repository variable selects
    # another image, such as one built from a branch.
    container: ${{ vars.CI_IMAGE || 'ghcr.io/gentoo/portage-ci:master' }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      matrix:
        start-method:
          - 'fork-or-forkserver'
          - 'spawn'
        python-version:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - 'pypy-3.11'
        exclude:
          - python-version: '3.9'
            start-method: 'spawn'
          - python-version: '3.10'
            start-method: 'spawn'
          - python-version: '3.11'
            start-method: 'spawn'
          - python-version: '3.12'
            start-method: 'spawn'
          - python-version: '3.13'
            start-method: 'spawn'
          - python-version: '3.14'
            start-method: 'spawn'
          - python-version: 'pypy-3.11'
            start-method: 'spawn'
        include:
          # Run one job with the playground metadata cache verified rather
          # than used, so that every playground keeps running egencache and
          # the assumptions behind the cache stay checked (see TEST-NOTES).
          - python-version: '3.13'
            start-method: 'fork-or-forkserver'
            verify-metadata-cache: true
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Select Python ${{ matrix.python-version }}
        run: |
          echo "/opt/python/${{ matrix.python-version }}/bin" >> "${GITHUB_PATH}"
      - name: Show versions
        run: |
          bash --version
          python -VV
          python -m site
      - name: Test meson install --destdir /tmp/install-root
        run: |
          echo -e "[binaries]\npython = '$(command -v python)'" > /tmp/native.ini
          meson setup --native-file /tmp/native.ini /tmp/build .
          meson install -C /tmp/build --destdir /tmp/install-root
      - name: Run tests for ${{ matrix.python-version }}
        run: |
          [[ "${{ matrix.start-method }}" == "spawn" ]] && export PORTAGE_MULTIPROCESSING_START_METHOD=spawn
          [[ "${{ matrix.verify-metadata-cache }}" == "true" ]] && export PORTAGE_TEST_VERIFY_METADATA_CACHE=1
          export PYTEST_ADDOPTS="-vv -ra -l -o console_output_style=count -n $(nproc) --dist=worksteal"
          # Use pytest-rerunfailures to workaround pytest-xdist worker crashes with spawn start-method (bug 924416).
          [[ "${{ matrix.start-method }}" == "spawn" ]] && PYTEST_ADDOPTS+=" --reruns 5 --only-rerun 'worker .* crashed while running'"
          meson test -C /tmp/build --verbose
